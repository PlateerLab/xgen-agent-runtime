[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xgen-agent-runtime"
version = "2.66.1"
description = "Harness-engineered agent pipeline library with 21-stage dual-abstraction architecture, built on the Anthropic API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "CocoRoF", email = "cocorof@users.noreply.github.com" },
]
keywords = [
    "agent",
    "pipeline",
    "anthropic",
    "claude",
    "harness",
    "ai",
    "llm",
    "mcp>=1.0.0,<3",
    "orchestration",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    # Core runtime
    "anthropic>=0.52.0",
    "mcp>=1.0.0,<3",
    "pydantic>=2.0",
    "jsonschema>=4.0",
    # httpx — declared explicitly because WebFetch imports it directly
    # (also a transitive dep via anthropic).
    "httpx>=0.27",
    # websockets — the gateway's Discord (Gateway) + Slack (Socket Mode)
    # adapters import it directly for inbound WebSocket connections.
    "websockets>=12.0",
    # Skills system loads SKILL.md frontmatter as YAML.
    "pyyaml>=6.0",

    # Memory subsystem
    # numpy: vector arithmetic for VectorHandle helpers + summary
    # statistics in the affect emitter.
    "numpy>=1.24",

    # Scheduled task daemon (xgen_agent_runtime.cron) — croniter parses +
    # iterates cron expressions.
    "croniter>=2.0",

    # WebSearch tool backend (DuckDuckGo).
    "ddgs>=9.11",

    # Embedding clients — every provider's SDK is a baseline dep so
    # hosts can swap providers via settings.json without re-installing.
    "openai>=1.50.0",
    "google-genai>=1.0.0",

    # SQL provider — sqlite is in stdlib; postgres needs psycopg + pgvector.
    "psycopg[binary]>=3.1",
    "pgvector>=0.3.0",

    # ── extras 흡수 (XGEN 은 기능을 옵션으로 두지 않는다) ──────────────
    # 예전에는 소비자가 xgen-agent-runtime[docs,ssh,browser] 처럼 태그를
    # 붙여야 켜졌다. 붙이는 걸 잊은 배포에서는 도구가 조용히 사라진다 —
    # 있어야 할 기능이 '없는 것'이 되는 실패는 원인을 찾기 가장 어렵다.
    # qdrant(벡터 메모리) · browser(an-web) · docs(edit2docs) · ssh
    "qdrant-client>=1.12.0",
    "xgen-an-web>=0.11.0; python_version >= '3.12'",
    "xgen-edit2docs>=0.16.1",
    "asyncssh>=2.14",
]

# Optional dev tooling — `pip install xgen-agent-runtime[dev]` for tests
# and lint. End-users never need these; they stay as an extras group
# so the runtime install footprint isn't bloated by pytest/ruff.
[project.optional-dependencies]
# 기능 extras(qdrant/browser/docs/ssh)는 core 로 흡수했다. dev 만 남긴다 —
# 테스트·린트 도구를 프로덕션 이미지에 넣을 이유가 없다.
# Browser* built-ins — an-web semantic web engine (embedded V8; needs
# Python >= 3.12 and glibc, so it stays out of the core install).
# Doc* built-ins — edit2docs document engine (docx/xlsx/pptx).
# Ssh* built-ins — remote command/SFTP over SSH. Pure-async (asyncssh),
# lazy-imported so the core install stays lean.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
    "asyncssh>=2.14",
]

[project.urls]
Homepage = "https://github.com/PlateerLab/xgen-agent-runtime"
Repository = "https://github.com/PlateerLab/xgen-agent-runtime"
Issues = "https://github.com/PlateerLab/xgen-agent-runtime/issues"
Documentation = "https://github.com/PlateerLab/xgen-agent-runtime#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/xgen_agent_runtime"]
# Phase 10.4 — bundled skills ship as `SKILL.md` files inside the
# package tree. Hatch's default rules pick up *.py only; force-include
# the markdown so installed wheels still have the bundled catalog.
artifacts = [
    "src/xgen_agent_runtime/skills/bundled/**/*.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/xgen_agent_runtime/",
    "src/xgen_agent_runtime/skills/bundled/**/*.md",
    "tests/",
    "README.md",
    "README_ko.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "c_phase_1: completeness criterion activated in Phase 1 (Interface)",
    "c_phase_2: completeness criterion activated in Phase 2 (Native Providers)",
    "c_phase_3: completeness criterion activated in Phase 3 (Validation)",
    "c_phase_4: completeness criterion activated in Phase 4 (Web Mirror)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
# tests/ is deliberately NOT excluded — CI runs `ruff check src/ tests/`
# and the config must not silently veto half of that command line.
# (Pre-2.2.0 `extend-exclude = ["tests"]` + `force-exclude = true` made
# the tests/ half of the CI invocation a no-op — audit 2026-06-09 §3.7.)
force-exclude = true

[tool.ruff.format]
# Formatter-only carve-out: tests/ predates formatter enforcement and a
# blanket reformat would churn ~130 files. *Lint* rules apply to tests/
# (see above); format normalization of tests/ is tracked separately.
exclude = ["tests/**"]

# ── mypy — typed-surface beachhead ─────────────────────────────────
# The package ships `py.typed` but had no type-checking CI (audit
# 2026-06-09 §3.7). Start permissive and on a beachhead: CI runs mypy
# over core/ and llm_client/ only (the surfaces hosts import against).
# Tighten incrementally — flip `check_untyped_defs`, then widen the
# package list — rather than gating the world at once.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
# Annotation-bearing defs only; untyped bodies are skipped for now.
follow_imports = "silent"
no_error_summary = false

# Modules with known non-trivial findings (dynamic attributes, conditional
# function variants, config-object reuse). Each needs a real refactor, not
# an annotation — parked here so the beachhead gate stays green while the
# fixes land one module at a time. Findings on file (2026-06-10):
#   core.pipeline         — Stage has no `_context` attr (set dynamically)
#   core.mutation         — conditional `wrapper` variants differ in arity;
#                           `cfg` rebound across ModelConfig/PipelineConfig
#   core.manifest_factory — Optional flows into dict(...) for chain_order
[[tool.mypy.overrides]]
module = [
    "xgen_agent_runtime.core.pipeline",
    "xgen_agent_runtime.core.mutation",
    "xgen_agent_runtime.core.manifest_factory",
]
ignore_errors = true
