name: CI — xgen-agent-runtime (library)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      # ⚠ 워크플로 자신도 넣는다. 없으면 **CI 설정을 고쳐도 CI 가 돌지 않아**
      #   고친 것이 맞는지 확인할 수 없다 (실제로 이것 때문에 세 번 헛돌았다).
      - ".github/workflows/**"
  pull_request:
    branches: [main]

concurrency:
  group: ci-lib-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruff

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  type-check:
    name: Type check (mypy beachhead)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      # Typed-surface beachhead: the package ships `py.typed`, so the
      # surfaces hosts import against (core/ + llm_client/) are gated.
      # Config lives in [tool.mypy] in pyproject.toml — widen the package
      # list there as more modules come clean.
      - name: Run mypy (core + llm_client)
        run: mypy src/xgen_agent_runtime/core src/xgen_agent_runtime/llm_client

      # docs/events.md is generated from the EventTypes catalogue; fail
      # if an event landed without regenerating the doc.
      - name: Check docs/events.md is current
        run: python scripts/gen_event_docs.py --check

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      # Full suite — tests/ also contains llm_client/, contract/ and
      # completeness/ beyond unit/ + integration/; running per-directory
      # subsets silently skipped them on 3.12/3.13 (audit 2026-06-09 §completeness).
      # 커버리지는 한 버전에서만 재면 충분하다. 예전에는 3.11 이 그 자리였는데
      # 3.12 하한으로 올리면서 조건이 영영 참이 되지 않아 **커버리지가 통째로
      # 사라질 뻔했다** — 조건부 스텝은 이렇게 조용히 죽는다.
      - name: Run full test suite
        if: matrix.python-version != '3.12'
        run: pytest --tb=short -q

      - name: Run full test suite with coverage
        if: matrix.python-version == '3.12'
        run: pytest tests/ --cov=xgen_agent_runtime --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip && pip install pip-audit
      - run: pip install -e .
      # CVE-2026-3219 affects pip 26.x itself; the CI runner installs an
      # affected pip and there is no fix release as of this commit.
      # Ignore the single CVE so the audit keeps catching real issues
      # in our dependency tree. Revisit once pip ships a fix.
      - run: pip-audit --ignore-vuln CVE-2026-3219

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, security-audit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata
        run: |
          pip install twine
          twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # main 에 버전이 오른 pyproject.toml 이 merge 됐는데 아무도 `git tag vX.Y.Z &&
  # git push origin vX.Y.Z` 를 안 하면 release.yml 이 영영 안 돈다 — 실제로 v4.0.1
  # 이 이렇게 몇 시간 동안 릴리즈 없이 main 에만 남아 있었다(#24). 사람이 잊을 수
  # 있는 수동 스텝을 지운다: 위 4개 잡이 전부 통과한 main push 에서 pyproject
  # 버전의 태그가 없으면 여기서 만들어 push 한다.
  #
  # ⚠ **태그 push 만으로는 release.yml 이 돌지 않는다.** GITHUB_TOKEN 으로 만든
  # 이벤트는 다른 워크플로를 트리거하지 않는 것이 GitHub 의 규칙이라(무한 루프
  # 방지), v4.2.0 이 태그만 생기고 릴리즈가 없는 상태로 남았다. 그래서 태그를
  # push 한 뒤 release.yml 을 **명시적으로 dispatch** 한다 — workflow_dispatch 는
  # GITHUB_TOKEN 으로도 허용되는 경로다.
  auto-tag:
    name: Auto-tag release version
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, security-audit, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      # release.yml 을 dispatch 하려면 필요하다 — 없으면 태그만 생기고 릴리즈가
      # 없는 상태(v4.2.0 이 그랬다)로 조용히 남는다.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pyproject 버전에 맞는 태그가 없으면 생성 + push
        run: |
          V=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="v$V"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "이미 존재: $TAG — 이번 push 는 버전이 안 바뀌었거나 이미 릴리즈됨"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: release.yml 을 그 태그로 dispatch
        # 태그를 방금 만든 경우에만 — 위 스텝이 조기 exit 하면 TAG 가 비어 있다.
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "$TAG"
